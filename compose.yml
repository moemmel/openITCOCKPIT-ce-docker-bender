---
# openITCOCKPIT CE - angepasst für Dockhand + Traefik
# Basis: https://github.com/openITCOCKPIT/openITCOCKPIT-ce-docker (compose.yml)
#
# Änderungen gegenüber Upstream:
#   1. Keine Host-Ports mehr (Zugriff nur über Traefik). Die Upstream-Datei veröffentlicht
#      z.B. "3306" und "6379" ohne Host-Port -> Docker belegt zufällige Host-Ports.
#      Hier: "expose" statt "ports" (nur im Backend-Netz erreichbar).
#   2. Alle 19 Named Volumes -> Bind-Mounts unter /opt/docker/itcockpit/<name>
#   3. Traefik-Labels + externes Netz traefik_proxy für den Service "openitcockpit"
#   4. Geheimnisse kommen als Variablen aus Dockhand (${...}), nicht aus Git
#   5. Postfix-Werte des Upstream-Betreibers entfernt
#   6. Alle openITCOCKPIT-Images auf einen gemeinsamen Versionstag (OITC_VERSION) gepinnt:
#      'latest' des CE-Images bricht derzeit den Start ab (mysqladmin vs. mysql.cnf) und
#      Frontend und statusengine-worker sollten dieselbe Version haben.
#   7. mysql:lts statt mysql:latest (so auch in der Upstream-Datei; latest war zuletzt MySQL 26.7)
#   8. SE_MYSQL_PASSWORD (statusengine-worker) = MYSQL_PASSWORD, sonst "Access denied" für den Worker
#   9. Grafana-Admin-Passwort aus Dockhand-Variable GRAFANA_ADMIN_PASSWORD; graphite-web mit GW_TIMEZONE
#  10. Supervisor-Passwort aus Dockhand-Variable SUPERVISOR_PASSWORD (naemon, prometheus, worker, frontend)
#  11. Postfix: Relay, Zugangsdaten und Absender-Umschreibung über POSTFIX_*-Variablen
#  12. OITC_MYSQL_PASSWORD (mod_gearman_worker) = MYSQL_PASSWORD, sonst scheitern Benachrichtigungen
#  13. restart: unless-stopped statt deploy.restart_policy (on-failure): Container starten nach einem Reboot des
#      Hosts wieder; carbon-cache1/2 hatten im Upstream gar keine Restart-Regel.
#
# Benötigte Variablen (in Dockhand beim Stack hinterlegen, NICHT in Git):
#   MYSQL_ROOT_PASSWORD, MYSQL_PASSWORD, OITC_ADMIN_EMAIL, OITC_ADMIN_PASSWORD, OITC_DOMAIN,
#   GRAFANA_ADMIN_PASSWORD, SUPERVISOR_PASSWORD, POSTFIX_HOSTNAME
#   (OITC_DOMAIN = Hostname der Instanz, z.B. monitoring.example.org)
# Optional: POSTFIX_RELAYHOST, POSTFIX_RELAY_USERNAME, POSTFIX_RELAY_PASSWORD, POSTFIX_SENDER_MAP,
#   OITC_VERSION (Standard: 5.7.0 - Image-Tag aller openITCOCKPIT-Container)
# Hinweis: In Passwörtern kein "$" verwenden (Compose würde es als Variable lesen).

x-oitc-db-secrets: &oitc-db-secrets
  MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD setzen}"
  MYSQL_PASSWORD: "${MYSQL_PASSWORD:?MYSQL_PASSWORD setzen}"

# Der statusengine-worker liest sein DB-Passwort aus SE_MYSQL_PASSWORD (nicht aus MYSQL_PASSWORD).
# Ohne diese Zeile gilt der Standardwert aus openitcockpit.env -> "Access denied".
x-oitc-se-secrets: &oitc-se-secrets
  SE_MYSQL_PASSWORD: "${MYSQL_PASSWORD:?MYSQL_PASSWORD setzen}"

# Das PHP-Kommando "cake" (Benachrichtigungen im mod_gearman_worker) liest das
# DB-Passwort aus OITC_MYSQL_PASSWORD. Das Frontend kommt ohne diese Variable aus und bekommt sie nicht. Ohne diese Zeile gilt der Standardwert aus openitcockpit.env
# -> "Access denied" beim Versand von Benachrichtigungen (Log: /tmp/openitcockpit/logs/nagios/cli-error.log).
x-oitc-app-db-secrets: &oitc-app-db-secrets
  OITC_MYSQL_PASSWORD: "${MYSQL_PASSWORD:?MYSQL_PASSWORD setzen}"

# Grafana-Admin-Passwort: Beide Variablen müssen denselben Wert haben (steht so in openitcockpit.env).
# Der Standardwert in der öffentlichen Upstream-Datei ist bekannt und darf nicht verwendet werden.
x-oitc-grafana-secrets: &oitc-grafana-secrets
  OITC_GRAFANA_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD setzen}"
  GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD setzen}"

# Supervisor-Passwort: Das Frontend steuert die Supervisor-Dienste von naemon, statusengine-worker,
# mod_gearman_worker und prometheus (Port 9001) - alle Container brauchen denselben Wert.
# Der Standardwert der Images ("password") ist bekannt.
x-oitc-supervisor-secrets: &oitc-supervisor-secrets
  SUPERVISOR_PASSWORD: "${SUPERVISOR_PASSWORD:?SUPERVISOR_PASSWORD setzen}"

services:

  gearmand:
    image: openitcockpit/gearmand:${OITC_VERSION:-5.7.0}
    restart: unless-stopped
    expose:
      - "4730" # Gearman-Job-Server
    ulimits: # See: https://statusengine.org/tutorials/gearman-to-many-files/
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - oitc-backend

  redis:
    image: redis:latest
    restart: unless-stopped
    expose:
      - "6379" # Redis-Server
    networks:
      - oitc-backend

  mysql:
    image: mysql:lts
    restart: unless-stopped
    env_file:
      - openitcockpit.env
    environment:
      <<: *oitc-db-secrets
    expose:
      - "3306" # MySQL Default Ports
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - oitc-backend
    volumes:
      - /opt/docker/itcockpit/mysql-data:/var/lib/mysql
    command: mysqld --sql_mode="" --innodb-buffer-pool-size=256M --innodb-flush-log-at-trx-commit=2 --innodb-file-per-table=1 --innodb-flush-method=O_DIRECT --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci --skip-log-bin

  victoria-metrics:
    image: openitcockpit/victoria-metrics:${OITC_VERSION:-5.7.0}
    restart: unless-stopped
    env_file:
      - openitcockpit.env
    expose:
      - "8428" # victoria-metrics
    networks:
      - oitc-backend

  carbon-c-relay:
    image: openitcockpit/carbon-c-relay:${OITC_VERSION:-5.7.0}
    restart: unless-stopped
    # Please notice: https://github.com/grobian/carbon-c-relay/issues/455
    env_file:
      - openitcockpit.env
    expose:
      - "2003" # local graphite plaintext port
    networks:
      - oitc-backend

  # You can add more carbon-cache instances if needed
  # Please notice: https://github.com/grobian/carbon-c-relay/issues/455
  carbon-cache1:
    image: openitcockpit/carbon-cache:${OITC_VERSION:-5.7.0}
    restart: unless-stopped
    env_file:
      - openitcockpit.env
    environment:
      - CC_INSTANCE=1 # Make sure to adjust this
    hostname: carbon-cache1
    volumes:
      - /opt/docker/itcockpit/graphite-data:/var/lib/graphite/whisper
    networks:
      - oitc-backend
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # You can add more carbon-cache instances if needed
  # Please notice: https://github.com/grobian/carbon-c-relay/issues/455
  carbon-cache2:
    image: openitcockpit/carbon-cache:${OITC_VERSION:-5.7.0}
    restart: unless-stopped
    env_file:
      - openitcockpit.env
    environment:
      - CC_INSTANCE=2 # Make sure to adjust this
    hostname: carbon-cache2
    volumes:
      - /opt/docker/itcockpit/graphite-data:/var/lib/graphite/whisper
    networks:
      - oitc-backend
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  graphite-web:
    image: openitcockpit/graphite-web:${OITC_VERSION:-5.7.0}
    restart: unless-stopped
    environment:
      GW_TIMEZONE: "Europe/Berlin"
    expose:
      - "8080" # Graphite Web
    volumes:
      - /opt/docker/itcockpit/graphite-data:/var/lib/graphite/whisper
    networks:
      - oitc-backend

  grafana:
    image: openitcockpit/grafana:${OITC_VERSION:-5.7.0}
    restart: unless-stopped
    env_file:
      - openitcockpit.env
    environment:
      <<: *oitc-grafana-secrets
    expose:
      - "3033" # Grafana
    networks:
      oitc-backend:
        aliases:
          - "grafana.docker"
    volumes:
      - /opt/docker/itcockpit/grafana-data:/var/lib/grafana

  naemon:
    image: openitcockpit/naemon:${OITC_VERSION:-5.7.0}
    restart: unless-stopped
    init: true
    env_file:
      - openitcockpit.env
    environment:
      <<: *oitc-supervisor-secrets
    expose:
      - "9001" # Supervisor
      - "9099" # Binaryd
    networks:
      - oitc-backend
    depends_on:
      - gearmand
    volumes:
      - /opt/docker/itcockpit/naemon-var:/opt/openitc/nagios/var
      - /opt/docker/itcockpit/naemon-var-local:/opt/openitc/nagios/var_local # Stuff like logfiles etc we do not care about this
      - /opt/docker/itcockpit/naemon-config:/opt/openitc/nagios/etc/config:ro

  mod_gearman_worker:
    image: openitcockpit/mod_gearman_worker:${OITC_VERSION:-5.7.0}
    restart: unless-stopped
    init: true
    env_file:
      - openitcockpit.env
    environment:
      <<: [*oitc-db-secrets, *oitc-se-secrets, *oitc-app-db-secrets, *oitc-supervisor-secrets]
      IS_WORKHORSE_CONTAINER: "1" # Enables the CLI for sending notifications and to be able to execute check plugins like EVC
    volumes:
      - /opt/docker/itcockpit/naemon-var:/opt/openitc/nagios/var
      - /opt/docker/itcockpit/oitc-agent-cert:/opt/openitc/agent:ro # TLS certificats of the openITCOCKPIT Monitoring Agent
      - /opt/docker/itcockpit/oitc-agent-etc:/opt/openitc/receiver/etc:ro # Configfile of the openITCOCKPIT Agent
      - /opt/docker/itcockpit/oitc-frontend-src:/opt/openitc/frontend:ro # Shared source code of openITCOCKPIT so that this container can execute EVC plugin and default notification scripts
    networks:
      - oitc-backend
    depends_on:
      - gearmand
    deploy:
      replicas: 1 # Increase this number if you need more mod_gearman worker containers

  statusengine-worker:
    image: openitcockpit/statusengine-worker:${OITC_VERSION:-5.7.0}
    restart: unless-stopped
    init: true
    env_file:
      - openitcockpit.env
    environment:
      <<: [*oitc-db-secrets, *oitc-se-secrets, *oitc-supervisor-secrets]
    networks:
      - oitc-backend
    depends_on:
      - redis
      - mysql
      - gearmand

  openitcockpit:
    image: openitcockpit/openitcockpit-ce:${OITC_VERSION:-5.7.0} # Community Edition of openITCOCKPIT
    restart: unless-stopped
    init: true
    env_file:
      - openitcockpit.env
    environment:
      <<: [*oitc-db-secrets, *oitc-se-secrets, *oitc-grafana-secrets, *oitc-supervisor-secrets]
      OITC_ADMIN_EMAIL: "${OITC_ADMIN_EMAIL:?OITC_ADMIN_EMAIL setzen}"
      OITC_ADMIN_PASSWORD: "${OITC_ADMIN_PASSWORD:?OITC_ADMIN_PASSWORD setzen}"
    # Keine Host-Ports (80/443): Traefik übernimmt. Das Backend spricht intern HTTPS (selbstsigniert).
    expose:
      - "80"
      - "443"
    networks:
      - oitc-backend
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      - "traefik.http.routers.itcockpit.rule=Host(`${OITC_DOMAIN:?OITC_DOMAIN setzen}`)"
      - "traefik.http.routers.itcockpit.entrypoints=websecure"
      - "traefik.http.routers.itcockpit.tls=true"
      - "traefik.http.routers.itcockpit.tls.certresolver=myresolver"
      - "traefik.http.services.itcockpit.loadbalancer.server.port=443"
      - "traefik.http.services.itcockpit.loadbalancer.server.scheme=https"
      # Das Backend nutzt ein selbstsigniertes Zertifikat. Traefik läuft hier mit
      # --serverstransport.insecureskipverify=true, ein eigener serversTransport ist deshalb nicht nötig.
    volumes:
      - /opt/docker/itcockpit/naemon-config:/opt/openitc/nagios/etc/config # Configuration files related to Naemon
      - /opt/docker/itcockpit/naemon-var:/opt/openitc/nagios/var # The status.dat is required for the recurring downtimes cronjob
      - /opt/docker/itcockpit/oitc-frontend-src:/opt/openitc/src_sharing/frontend # Frontend of openITCOCKPIT to be shared with mod_gearman container so that the container can execute the EVC plugin
      - /opt/docker/itcockpit/oitc-webroot:/opt/openitc/frontend/webroot # Webroot of openITCOCKPIT to keep images and share files with puppeteer
      - /opt/docker/itcockpit/oitc-maps:/opt/openitc/frontend/plugins/MapModule/webroot/img # Images of the MapModule
      - /opt/docker/itcockpit/oitc-agent-cert:/opt/openitc/agent # TLS certificats of the openITCOCKPIT Monitoring Agent
      - /opt/docker/itcockpit/oitc-agent-etc:/opt/openitc/receiver/etc # Configuration for the openITCOCKPIT Monitoring Agent Check Reciver
      - /opt/docker/itcockpit/oitc-var:/opt/openitc/var # A safe harbor to store .lock files
      - /opt/docker/itcockpit/oitc-backups:/opt/openitc/nagios/backup # Automaticaly generated MySQL dumps
      #- /opt/docker/itcockpit/oitc-import:/opt/openitc/frontend/plugins/ImportModule/webroot/files # Uplaoded files of the ImportModule
      - /opt/docker/itcockpit/oitc-styles:/opt/openitc/frontend/plugins/DesignModule/webroot/css # Custom styles of the DesignModule
      - /opt/docker/itcockpit/checkmk-agents:/opt/openitc/check_mk/agents:ro
      - /opt/docker/itcockpit/checkmk-etc:/opt/openitc/check_mk/etc/check_mk
      - /opt/docker/itcockpit/checkmk-var:/opt/openitc/check_mk/var/check_mk
      - /opt/docker/itcockpit/prometheus-config:/opt/openitc/prometheus # Configuration files related to Prometheus
    depends_on:
      - redis
      - mysql
      - gearmand

  puppeteer:
    image: openitcockpit/puppeteer:${OITC_VERSION:-5.7.0}
    restart: unless-stopped
    init: true
    env_file:
      - openitcockpit.env
    expose:
      - "8084" # Puppeteer Web Server
    networks:
      - oitc-backend
    volumes:
      - /opt/docker/itcockpit/oitc-webroot:/opt/openitc/frontend/webroot:ro

  checkmk:
    image: openitcockpit/checkmk:${OITC_VERSION:-5.7.0}
    restart: unless-stopped
    init: true
    env_file:
      - openitcockpit.env
    expose:
      - "1234" # Checkmk Wrapper HTTP API
    networks:
      - oitc-backend
    volumes:
      - /opt/docker/itcockpit/naemon-var:/opt/openitc/nagios/var # oitc.cmd
      - /opt/docker/itcockpit/checkmk-agents:/opt/omd/sites/nagios/version/share/check_mk/agents
      - /opt/docker/itcockpit/checkmk-etc:/omd/sites/nagios/etc/check_mk
      - /opt/docker/itcockpit/checkmk-var:/omd/sites/nagios/var/check_mk

  prometheus:
    image: openitcockpit/prometheus:${OITC_VERSION:-5.7.0}
    restart: unless-stopped
    init: true
    env_file:
      - openitcockpit.env
    environment:
      <<: *oitc-supervisor-secrets
    expose:
      - "9001" # Supervisor
      - "9099" # Binaryd
      - "9090" # Prometheus
    networks:
      - oitc-backend
    depends_on:
      - victoria-metrics
      - openitcockpit
    volumes:
      - /opt/docker/itcockpit/prometheus-var:/opt/openitc/var
      - /opt/docker/itcockpit/prometheus-config:/opt/openitc/prometheus:ro

  # Docs about the postfix container can be found
  # - https://hub.docker.com/r/boky/postfix
  # - https://github.com/bokysan/docker-postfix
  postfix:
    image: boky/postfix
    restart: unless-stopped
    environment:
      HOSTNAME: "${POSTFIX_HOSTNAME:?POSTFIX_HOSTNAME setzen}" # Postfix myhostname
      RELAYHOST: "${POSTFIX_RELAYHOST:-}" # z.B. [mail.example.org]:587 (leer = direkte Zustellung)
      RELAYHOST_USERNAME: "${POSTFIX_RELAY_USERNAME:-}"
      RELAYHOST_PASSWORD: "${POSTFIX_RELAY_PASSWORD:-}" # als Dockhand-Variable, nicht in Git
      # Das Relay lehnt Absender ab, die nicht zum Benutzernamen passen -> alle Absender umschreiben:
      POSTFIX_sender_canonical_maps: "${POSTFIX_SENDER_MAP:-}" # z.B. static:absender@example.org
      ALLOW_EMPTY_SENDER_DOMAINS: "true"
    expose:
      - "587" # SMTP Submission (nur Backend-Netz)
    networks:
      - oitc-backend

networks:
  oitc-backend:
  traefik_proxy:
    external: true
